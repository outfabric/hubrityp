# HubrityP — local development compose.
#
# Convention: the Supabase CLI (`npm run supabase:start`) owns Postgres, GoTrue,
# Kong, PostgREST, Storage, and Mailpit (Realtime/Studio/postgres-meta/edge-
# runtime/Logflare/Vector are excluded via `-x` in the npm script because the
# app does not use them). This file only declares the Next.js dev container,
# the Inngest Dev Server, and bridges them onto the network the CLI manages
# (`supabase_network_<project_id>` — see `supabase/config.toml`).
#
# Profiles:
#   - inngest: Inngest Dev Server (opt-in, necessario apenas para testar background jobs)
#
# Uso:
#   docker compose up                          # sobe apenas o app (Next.js)
#   docker compose --profile inngest up        # sobe app + Inngest Dev Server
#   COMPOSE_PROFILES=inngest docker compose up # equivalente via env var
#
# Start order:
#   1. `npm run supabase:start`   # boots the Supabase stack and creates the network
#   2. `docker compose up`        # boots Next.js (+ Inngest se profile ativo)

services:
  app:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0"
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - app-node-modules:/app/node_modules
    environment:
      # Reach the Supabase Postgres via the CLI-managed container hostname
      # (resolvable on `supabase_network_hubrityp`). Override locally via .env
      # if you point the app at a different stack.
      DATABASE_URL: postgresql://postgres:postgres@supabase_db_hubrityp:5432/postgres
      NEXT_PUBLIC_SUPABASE_URL: http://supabase_kong_hubrityp:8000
      # Absolute base URL of the public marketing site. Required by clientEnv;
      # inlined at build time. In local dev the app serves both the public site
      # and the app at localhost:3000.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Browser-facing Supabase URL — Kong is port-mapped to 54321 on the host.
      # Signed Storage URLs are rewritten from the internal hostname to this
      # origin before being returned to the browser (CSP also permits it).
      SUPABASE_PUBLIC_URL: http://localhost:54321
      # Public origin used to build patient-facing absolute URLs (e.g. the
      # shareable telepsychology video link). Without it, patientVideoUrl is
      # null and the copy-link affordances stay silently inert in local dev.
      APP_URL: http://localhost:3000
      # Gemini API key — fake default for local dev. Replace with a real key
      # when testing AI transcription features end-to-end.
      GEMINI_API_KEY: fake-gemini-key-for-local-dev
      SIGNATURE_HASH_SALT: local-dev-signature-hash-salt-minimum-32-chars
      PENDING_EMAIL_COOKIE_SECRET: local-dev-pending-email-cookie-secret-min-32-chars
      # Encryption key for @inngest/middleware-encryption (z.string().min(32)).
      # Required by serverEnv at boot — without it every SSR page 500s. This is
      # a dummy local-dev value; production/preview get a real key from the
      # Vercel Marketplace Inngest integration.
      INNGEST_ENCRYPTION_KEY: local-dev-inngest-encryption-key-minimum-32-chars
      NEXT_PUBLIC_STREAM_API_KEY: dummy_stream_key_for_local_dev
      STREAM_API_KEY: dummy_stream_key_for_local_dev
      STREAM_API_SECRET: dummy_stream_secret_for_local_dev
      STREAM_WEBHOOK_SECRET: dummy_stream_webhook_secret_for_local_dev
      # WhatsApp UI entry points stay frozen behind this flag (default off).
      # NEXT_PUBLIC_ is inlined at build time, so flipping this requires a
      # rebuild of the dev container's .next, not just a restart.
      NEXT_PUBLIC_WHATSAPP_UI_ENABLED: 'false'
      # Tell the Inngest SDK to send events to the Dev Server container.
      # So funciona quando o profile `inngest` esta ativo (o host `inngest`
      # nao existe sem ele). Sem o Dev Server, o app boota normalmente —
      # chamadas inngest.send() falham com erro de conexao, o que e aceitavel
      # em dev quando nao se esta testando background jobs.
      INNGEST_DEV: http://inngest:8288
    networks:
      - supabase

  # Inngest Dev Server — provides the local execution engine for durable
  # functions (WhatsApp reminders, reconciliation, webhooks). Connects to the
  # Next.js serve handler at http://app:3000/api/inngest to discover and
  # execute registered functions. UI available at http://localhost:8288.
  inngest:
    image: inngest/inngest:latest
    command: inngest dev -u http://app:3000/api/inngest --no-discovery
    ports:
      - '8288:8288'
    profiles:
      - inngest
    networks:
      - supabase
    depends_on:
      - app

volumes:
  app-node-modules:

networks:
  supabase:
    name: supabase_network_hubrityp
    external: true
