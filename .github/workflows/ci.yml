name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel in-progress runs for the same ref so a force-push doesn't double-bill
# the runner pool.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run format:check

      - run: npm run spell

      - run: npm run test:unit

  integration:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify Docker is available (Testcontainers prereq)
        run: docker info

      - run: npm run test:integration

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the lockfile so the cache invalidates whenever the
          # Playwright version changes (which is what determines the binary
          # version).
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Docker is available (Testcontainers prereq)
        run: docker info

      # Build needs env vars at parse time (src/shared/env/index.ts validates
      # on import). Real DATABASE_URL is provided per-run by Playwright
      # globalSetup; the build only needs valid placeholders.
      - name: Build the app
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: ci-build-service-key
          NEXT_PUBLIC_STREAM_API_KEY: ci-build-stream-public-key
          STREAM_API_KEY: ci-build-stream-api-key
          STREAM_API_SECRET: ci-build-stream-api-secret
          STREAM_WEBHOOK_SECRET: ci-build-stream-webhook-secret
          GEMINI_API_KEY: ci-build-gemini-api-key
          INNGEST_ENCRYPTION_KEY: ci-build-inngest-encryption-key-32ch
          INNGEST_SIGNING_KEY: ci-build-inngest-signing-key
          SIGNATURE_HASH_SALT: ci-build-signature-hash-salt-minimum-32-chars
          LOG_LEVEL: silent
        run: npm run build

      - run: npm run test:e2e:seeded

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # The @auth-real suite exercises the full GoTrue handshake against the real
  # Supabase stack (`supabase start`), not the mock-GoTrue + Testcontainers
  # used by the default e2e job. We gate it behind `e2e` so a failing default
  # suite short-circuits this slower job and saves runner minutes. Because
  # both suites bind a server to port 54321, they cannot run concurrently —
  # `needs: e2e` enforces sequencing in CI as well.
  e2e-real:
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify Docker is available (Supabase prereq)
        run: docker info

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Supabase must start BEFORE the build because `NEXT_PUBLIC_*` vars are
      # inlined by Next.js at build time. The anon key inlined into the bundle
      # must be the REAL key the local GoTrue/Kong stack accepts — a placeholder
      # causes the Supabase SSR client's session refresh to fail (Kong rejects
      # the invalid apikey), silently clearing session cookies and breaking the
      # auth round-trip.
      - name: Start Supabase
        run: supabase start

      - name: Apply Drizzle migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: npm run db:migrate

      # Read the real keys from the running Supabase stack and build with them.
      # `NEXT_PUBLIC_SUPABASE_URL` and `NEXT_PUBLIC_SUPABASE_ANON_KEY` are
      # inlined into both client and server bundles — they MUST match the
      # running stack. Non-NEXT_PUBLIC vars only need to satisfy the Zod
      # validator at module-load time (dummy values are fine).
      - name: Build the app
        run: |
          SUPABASE_STATUS=$(supabase status -o json 2>/dev/null)
          export NEXT_PUBLIC_SUPABASE_URL=$(echo "$SUPABASE_STATUS" | jq -r '.API_URL')
          export NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$SUPABASE_STATUS" | jq -r '.ANON_KEY')
          export SUPABASE_SERVICE_ROLE_KEY=$(echo "$SUPABASE_STATUS" | jq -r '.SERVICE_ROLE_KEY')
          export DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          export NEXT_PUBLIC_SITE_URL=http://localhost:3000
          export NEXT_PUBLIC_STREAM_API_KEY=ci-build-stream-public-key
          export STREAM_API_KEY=ci-build-stream-api-key
          export STREAM_API_SECRET=ci-build-stream-api-secret
          export STREAM_WEBHOOK_SECRET=ci-build-stream-webhook-secret
          export GEMINI_API_KEY=ci-build-gemini-api-key
          export INNGEST_ENCRYPTION_KEY=ci-build-inngest-encryption-key-32ch
          export INNGEST_SIGNING_KEY=ci-build-inngest-signing-key
          export SIGNATURE_HASH_SALT=ci-build-signature-hash-salt-minimum-32-chars
          export LOG_LEVEL=silent
          npm run build

      - name: Run @auth-real Playwright suite
        run: npm run test:e2e:real

      # Always stop Supabase to release Docker resources, even when the
      # test step fails — otherwise the runner can leak containers across
      # retries. `--no-backup` skips the local DB dump (~10s, not useful
      # in CI where state is ephemeral).
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

      - name: Upload Playwright @auth-real report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-real
          path: playwright-report-real/
          retention-days: 14
